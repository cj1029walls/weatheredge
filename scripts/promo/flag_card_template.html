<!DOCTYPE html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1200px;height:675px;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:linear-gradient(135deg,#0a1330 0%,#152451 60%,#24409c 140%);color:#fff;overflow:hidden;position:relative}
.ball{position:absolute;right:-110px;top:-110px;width:430px;height:430px;opacity:.10}
.wind{position:absolute;left:-40px;bottom:-30px;width:560px;opacity:.08}
.wrap{position:relative;padding:44px 58px;height:100%;display:flex;flex-direction:column}
.brand{display:flex;align-items:center;gap:14px}
.brand h1{font-size:34px;font-weight:800;letter-spacing:1px}
.brand h1 span{font-weight:300;color:#93a1b8}
.flagbadge{background:linear-gradient(135deg,#ff5a4e,#d33131);color:#fff;border-radius:11px;padding:5px 16px;font-size:16px;letter-spacing:3px;font-weight:800;display:flex;align-items:center;gap:8px}
.date{margin-left:auto;font-size:17px;font-weight:800;color:#8b99b5;letter-spacing:2px}
.head{margin-top:30px;font-size:52px;font-weight:800;line-height:1.12}
.head b{color:#ffd94a}
.game{margin-top:12px;font-size:20px;color:#aab6d0;font-weight:700}
.game b{color:#e7eeff}
.stats{margin-top:32px;display:flex;gap:16px}
.stat{flex:1;background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.15);border-radius:18px;padding:22px 26px}
.stat .v{font-size:46px;font-weight:800;color:#ffd94a;line-height:1}
.stat .v.rd{color:#ff8a7a}
.stat .k{margin-top:9px;font-size:13.5px;font-weight:800;letter-spacing:1.4px;color:#8b99b5;text-transform:uppercase;line-height:1.45}
.tease{margin-top:auto;background:rgba(255,217,74,.10);border:1px solid rgba(255,217,74,.35);border-radius:16px;padding:17px 26px;display:flex;align-items:center;gap:14px;font-size:21px;font-weight:700;color:#e7eeff}
.tease b{color:#ffd94a}
.tease .lock{font-size:26px}
.foot{margin-top:16px;display:flex;align-items:center;font-size:16.5px;font-weight:700;color:#8b99b5}
.url{margin-left:auto;background:#fff;color:#152451;border-radius:26px;padding:10px 28px;font-size:21px;font-weight:800}
</style></head><body>
<svg class="ball" viewBox="0 0 100 100"><circle cx="50" cy="50" r="44" fill="none" stroke="#e7eeff" stroke-width="1.4"/><path d="M25,14 Q45,50 25,86" fill="none" stroke="#e7eeff" stroke-width="1.4"/><path d="M75,14 Q55,50 75,86" fill="none" stroke="#e7eeff" stroke-width="1.4"/></svg>
<svg class="wind" viewBox="0 0 200 100"><g stroke="#e7eeff" stroke-width="3" fill="none" stroke-linecap="round"><path d="M10,30 h95 a12,12 0 1 0 -12,-12"/><path d="M10,55 h140 a14,14 0 1 1 -14,14"/><path d="M10,80 h70 a10,10 0 1 0 -10,-10"/></g></svg>
<div class="wrap">
  <div class="brand"><h1>DFS<span>RADAR</span></h1><div class="flagbadge">🚨 RADAR FLAG</div><div class="date">{{DATE}}</div></div>
  <div class="head">{{HEADLINE}}</div>
  <div class="game">{{GAMELINE}}</div>
  <div class="stats">
    <div class="stat"><div class="v">{{STAT1}}</div><div class="k">{{STAT1_LABEL}}</div></div>
    <div class="stat"><div class="v">{{STAT2}}</div><div class="k">{{STAT2_LABEL}}</div></div>
    <div class="stat"><div class="v rd">{{STAT3}}</div><div class="k">{{STAT3_LABEL}}</div></div>
  </div>
  <div class="tease"><span class="lock">🔒</span><span>{{TEASE}}</span></div>
  <div class="foot">Live forecasts × every park's real weather history · free<div class="url">dfsradar.com</div></div>
</div>
</body></html>
