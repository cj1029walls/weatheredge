name: Daily slate build & deploy

on:
  workflow_dispatch:
  schedule:
    - cron: "0 10 * * *"   # ~6:00 AM ET — morning slate build
    - cron: "30 16 * * *"  # ~12:30 PM ET — refresh before day games
    - cron: "0 21 * * *"   # ~5:00 PM ET — refresh before night games

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build today's data.json (schedule + forecasts + history match)
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python scripts/daily_build.py
      - name: Persist prediction archive & accuracy grades
        run: |
          git config user.name "weatheredge-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/predictions data/accuracy.json 2>/dev/null || true
          git commit -m "Archive predictions / update accuracy" || echo "no changes"
          git pull --rebase origin main || true
          git push || echo "push skipped"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
