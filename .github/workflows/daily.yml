name: Daily slate build & deploy

on:
  workflow_dispatch:
  schedule:
    - cron: "0 10 * * *"   # ~6:00 AM ET — morning slate build
    - cron: "30 16 * * *"  # ~12:30 PM ET — refresh before day games
    - cron: "0 21 * * *"   # ~5:00 PM ET — refresh before night games

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build today's data.json (schedule + forecasts + history match)
        run: python scripts/daily_build.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
