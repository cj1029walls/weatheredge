name: Daily slate build & deploy

on:
  workflow_dispatch:
  schedule:
    - cron: "0 10 * * *"   # ~6:00 AM ET — morning slate build
    - cron: "30 14 * * *"  # ~10:30 AM ET — first card with posted prop lines
    - cron: "30 16 * * *"  # ~12:30 PM ET — refresh before day games
    - cron: "0 21 * * *"   # ~5:00 PM ET — refresh before night games

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build today's data.json (schedule + forecasts + history match)
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python scripts/daily_build.py
      - name: Grade PRO results (yesterday's card)
        run: python scripts/pro/grade.py || echo "grading skipped"
      - name: Refresh props odds (fresh lines for this build)
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python scripts/odds/props_build.py || echo "odds refresh skipped — using last committed feed"
      - name: Update umpire dataset (site/pro/umps.json)
        run: python scripts/pro/ump_detail.py || echo "ump dataset skipped — using last committed caches"
      - name: Build PRO HR-prop targets (site/pro/data.json)
        run: python scripts/pro/build.py
      - name: Persist prediction archive & accuracy grades
        run: |
          git config user.name "weatheredge-bot"
          git config user.email "actions@users.noreply.github.com"
          # site/pro/props.json is TRACKED and rewritten by the odds step above.
          # Leaving it unstaged made every `git pull --rebase` abort on a dirty
          # worktree, so the push was never rebased — and both failures were
          # masked, silently discarding the day's archive and grades.
          git add data/predictions data/accuracy.json data/pro site/pro/props.json
          git commit -m "Archive predictions / update accuracy" \
            || { echo "no changes to commit"; exit 0; }
          for i in 1 2 3 4 5; do
            if git pull --rebase --autostash origin main && git push; then
              echo "archive pushed on attempt $i"
              exit 0
            fi
            echo "push attempt $i failed (remote moved) — retrying"
            sleep $((i * 6))
          done
          echo "::error::archive push failed after 5 attempts — predictions and accuracy grades were NOT saved"
          exit 1
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
