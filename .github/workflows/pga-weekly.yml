name: PGA weekly build

on:
  workflow_dispatch:
  # Started by the Clock workflow (scripts/ci/clock.py) at 5:52 AM Eastern
  # every day. The schedule below is only a fallback for a stopped clock
  # (GitHub delivers it 5-10 hours late).
  schedule:
    - cron: "52 9 * * *"

permissions:
  contents: write
  actions: write      # to ask for a publish (see the last steps)

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  pga:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build site/pga/data.json
        id: free
        continue-on-error: true
        run: python scripts/pga/weekly_build.py
      - name: Mark free page stale
        if: steps.free.outcome == 'failure'
        run: python scripts/ci/mark_stale.py site/pga/data.json "the tee-time forecast refresh failed"
      - name: Refresh deep history (results + archive weather)
        id: deep
        continue-on-error: true
        run: python scripts/pga/deep_history.py
      - name: Grade PRO leans (completed events)
        id: grade
        continue-on-error: true
        run: python scripts/pro/pga_grade.py
      - name: Build PRO board (site/pro/pga.json)
        id: pro
        continue-on-error: true
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python scripts/pro/pga_build.py
      - name: Mark PRO board stale
        if: steps.pro.outcome == 'failure'
        run: python scripts/ci/mark_stale.py site/pro/pga.json "the PRO board rebuild failed"
      - name: Commit data
        if: ${{ !cancelled() }}
        run: >-
          bash scripts/ci/commit_push.sh "PGA refresh"
          site/pga/data.json site/pro/pga.json site/pro/pga_record.json
          data/pga data/pro/pga_predictions data/pro/pga_results.json
      - name: Ask for a publish
        # A run the Clock started belongs to github-actions[bot], and GitHub
        # raises no workflow_run event for it, so publish.yml would never hear
        # that new data was committed. (Scheduled and hand-started runs still
        # reach publish.yml through workflow_run.)
        if: ${{ !cancelled() && github.actor == 'github-actions[bot]' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run publish.yml -R "$GITHUB_REPOSITORY" --ref main
      - name: Report
        if: ${{ !cancelled() }}
        run: >-
          bash scripts/ci/gate.sh
          "PGA free page=${{ steps.free.outcome }}"
          "PGA PRO board=${{ steps.pro.outcome }}"
          -- "PGA deep history=${{ steps.deep.outcome }}"
          "PGA grading=${{ steps.grade.outcome }}"
