name: PGA weekly build

on:
  workflow_dispatch:
  schedule:
    - cron: "0 10 * * *"    # daily ~6:00 AM ET — tee-time wave forecasts sharpen

permissions:
  contents: write

jobs:
  pga:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build site/pga/data.json
        run: python scripts/pga/weekly_build.py
      - name: Commit data
        run: |
          git config user.name "weatheredge-bot"
          git config user.email "actions@users.noreply.github.com"
          git add site/pga/data.json
          git commit -m "PGA refresh" || echo "no changes"
          git pull --rebase origin main
          git push
