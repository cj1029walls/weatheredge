name: NASCAR weekly build

on:
  workflow_dispatch:
  # Started by the Clock workflow (scripts/ci/clock.py) at 6:19 AM Eastern
  # every day. The schedule below is only a fallback for a stopped clock
  # (GitHub delivers it 5-10 hours late).
  schedule:
    - cron: "19 10 * * *"

permissions:
  contents: write
  actions: write      # to ask for a publish (see the last steps)

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  nascar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build site/nascar/data.json
        id: free
        continue-on-error: true
        run: python scripts/nascar/weekly_build.py
      - name: Mark free page stale
        if: steps.free.outcome == 'failure'
        run: python scripts/ci/mark_stale.py site/nascar/data.json "the race forecast refresh failed"
      - name: Refresh deep history (results + archive weather)
        id: deep
        continue-on-error: true
        run: python scripts/nascar/deep_history.py
      - name: Grade PRO leans (completed races)
        id: grade
        continue-on-error: true
        run: python scripts/pro/nascar_grade.py
      - name: Build PRO board (site/pro/nascar.json)
        id: pro
        continue-on-error: true
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python scripts/pro/nascar_build.py
      - name: Mark PRO board stale
        if: steps.pro.outcome == 'failure'
        run: python scripts/ci/mark_stale.py site/pro/nascar.json "the PRO board rebuild failed"
      - name: Commit data
        if: ${{ !cancelled() }}
        run: >-
          bash scripts/ci/commit_push.sh "NASCAR refresh"
          site/nascar/data.json site/pro/nascar.json site/pro/nascar_record.json
          data/nascar data/pro/nascar_predictions data/pro/nascar_results.json
      - name: Ask for a publish
        # A run the Clock started belongs to github-actions[bot], and GitHub
        # raises no workflow_run event for it, so publish.yml would never hear
        # that new data was committed. (Scheduled and hand-started runs still
        # reach publish.yml through workflow_run.)
        if: ${{ !cancelled() && github.actor == 'github-actions[bot]' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run publish.yml -R "$GITHUB_REPOSITORY" --ref main
      - name: Report
        if: ${{ !cancelled() }}
        run: >-
          bash scripts/ci/gate.sh
          "NASCAR free page=${{ steps.free.outcome }}"
          "NASCAR PRO board=${{ steps.pro.outcome }}"
          -- "NASCAR deep history=${{ steps.deep.outcome }}"
          "NASCAR grading=${{ steps.grade.outcome }}"
