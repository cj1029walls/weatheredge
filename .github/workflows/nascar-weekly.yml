name: NASCAR weekly build

on:
  workflow_dispatch:
  schedule:
    - cron: "15 10 * * *"   # daily ~6:15 AM ET — race-day forecasts sharpen

permissions:
  contents: write

jobs:
  nascar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build site/nascar/data.json
        run: python scripts/nascar/weekly_build.py
      - name: Commit data
        run: |
          git config user.name "weatheredge-bot"
          git config user.email "actions@users.noreply.github.com"
          git add site/nascar/data.json
          git commit -m "NASCAR refresh" || echo "no changes"
          git pull --rebase origin main
          git push
