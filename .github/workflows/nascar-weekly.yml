name: NASCAR weekly build

on:
  workflow_dispatch:
  schedule:
    - cron: "15 10 * * *"   # daily ~6:15 AM ET — race-day forecasts sharpen

permissions:
  contents: write

jobs:
  nascar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build site/nascar/data.json
        run: python scripts/nascar/weekly_build.py
      - name: Refresh deep history (results + archive weather)
        run: python scripts/nascar/deep_history.py || echo "deep history refresh failed — keeping last dataset"
      - name: Build PRO board (site/pro/nascar.json)
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python scripts/pro/nascar_build.py
      - name: Commit data
        run: |
          git config user.name "weatheredge-bot"
          git config user.email "actions@users.noreply.github.com"
          git add site/nascar/data.json site/pro/nascar.json data/nascar data/pro/nascar_predictions
          git commit -m "NASCAR refresh" || echo "no changes"
          git pull --rebase origin main
          git push
