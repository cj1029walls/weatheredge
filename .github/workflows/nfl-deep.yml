name: NFL deep history (refs, travel, weather splits)

on:
  workflow_dispatch:
  schedule:
    - cron: "0 9 * * 2"   # Tuesdays 9:00 UTC — refresh after the full week

permissions:
  contents: write

jobs:
  deep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build data/nfl/deep.json
        run: python scripts/nfl/deep_history.py
      - name: Commit dataset
        run: |
          git config user.name "weatheredge-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/nfl/deep.json
          git commit -m "NFL deep history refresh" || echo "no changes"
          git pull --rebase origin main
          git push
