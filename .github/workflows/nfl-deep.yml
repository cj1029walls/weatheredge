name: NFL deep history (refs, travel, weather splits)

on:
  workflow_dispatch:
  schedule:
    - cron: "41 8 * * 2"  # Tuesdays ~8:41 UTC — refresh after the full week

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  deep:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build data/nfl/deep.json
        run: python scripts/nfl/deep_history.py
      - name: Commit dataset
        run: bash scripts/ci/commit_push.sh "NFL deep history refresh" data/nfl/deep.json
