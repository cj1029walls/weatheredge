name: CFB trench backtest (one-off research)

on:
  workflow_dispatch:
    inputs:
      force:
        description: "Run in season anyway (spends ~80 of the 1,000 monthly CFBD calls)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: CFBD budget guard
        # ~80 CFBD calls per run. The free plan is 1,000/month and the weekly
        # CFB job needs ~75 of them; two in-season rebuilds on Sept 3-4 (~740
        # calls) are why the key ran dry on Sept 20. Off-season runs are fine.
        if: github.event_name == 'workflow_dispatch' && !inputs.force
        run: |
          m=$(date -u +%-m)
          if [ "$m" -ge 8 ] || [ "$m" -le 1 ]; then
            echo "::error title=Blocked in season::This run costs ~80 of the 1,000 monthly CFBD calls. Re-run with force=true if you really mean it."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run backtest
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: python scripts/cfb/trench_backtest.py
      - name: Commit results
        run: bash scripts/ci/commit_push.sh "CFB trench backtest results" data/cfb/trench_backtest.json
