name: CFB trench backtest (one-off research)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run backtest
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: python scripts/cfb/trench_backtest.py
      - name: Commit results
        run: |
          git config user.name "weatheredge-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/cfb/trench_backtest.json
          git commit -m "CFB trench backtest results" || echo "no changes"
          git pull --rebase origin main
          git push
