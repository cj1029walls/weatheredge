name: Build NFL history

on:
  workflow_dispatch:
  schedule:
    - cron: "0 9 15 2 *"   # each Feb 15 — fold the finished season in

permissions:
  contents: write

jobs:
  nfl-history:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build NFL stadiums_history.json (nflverse + Open-Meteo archive)
        run: python scripts/nfl/build_history.py
      - name: Commit dataset
        run: |
          git config user.name "weatheredge-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/nfl/stadiums_history.json
          git commit -m "Rebuild NFL history" || echo "no changes"
          git pull --rebase origin main
          git push
