name: Build NFL history

on:
  workflow_dispatch:
  schedule:
    - cron: "34 9 15 2 *"  # each Feb 15 — fold the finished season in

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  nfl-history:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build NFL stadiums_history.json (nflverse + Open-Meteo archive)
        run: python scripts/nfl/build_history.py
      - name: Commit dataset
        run: bash scripts/ci/commit_push.sh "Rebuild NFL history" data/nfl/stadiums_history.json
