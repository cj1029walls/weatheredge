name: Net test (temporary diagnostics)

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe remaining sources
        run: |
          probe () {
            echo "== $1"
            curl -sS -o /tmp/out -w "HTTP %{http_code} - %{size_download}B\n" --max-time 40 "$2" -H "User-Agent: Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/126.0 Safari/537.36" -H "Accept: application/json" || echo "CURL FAILED"
            head -c 150 /tmp/out || true
            echo ""
            echo "--"
          }
          probe "nascar cf race_list 2024" "https://cf.nascar.com/cacher/2024/race_list_basic.json"
          probe "nascar cf race_list 2019" "https://cf.nascar.com/cacher/2019/race_list_basic.json"
          probe "nascar cf weekend-feed" "https://cf.nascar.com/cacher/2024/1/5285/weekend-feed.json"
          probe "espn golf via wikipedia-style host sports.core" "https://sports.core.api.espn.com/v2/sports/golf/leagues/pga/seasons/2024/types"
          probe "site.web.api golf" "https://site.web.api.espn.com/apis/site/v2/sports/golf/pga/scoreboard?dates=2024"
          probe "datagolf no-key check" "https://feeds.datagolf.com/field-updates?tour=pga&file_format=json"
