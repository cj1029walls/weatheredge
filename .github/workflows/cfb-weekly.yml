name: CFB weekly slate build

on:
  workflow_dispatch:
  schedule:
    - cron: "45 9 * * *"    # daily ~5:45 AM ET — forecasts sharpen as kickoff nears
    - cron: "30 14 * * 6"   # Saturdays ~10:30 AM ET — final pre-kick refresh

permissions:
  contents: write

jobs:
  cfb-slate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build site/cfb/data.json
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: python scripts/cfb/weekly_build.py
      - name: Build PRO Trench Edge board (site/pro/cfb.json)
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: python scripts/pro/cfb_build.py || echo "trench board skipped — using last committed board"
      - name: Commit slate data
        run: |
          git config user.name "weatheredge-bot"
          git config user.email "actions@users.noreply.github.com"
          git add site/cfb/data.json 2>/dev/null || true
          git add site/pro/cfb.json data/pro/cfb_predictions 2>/dev/null || true
          git commit -m "CFB slate refresh" || echo "no changes"
          git pull --rebase origin main
          git push
