name: Build hitter history

on:
  workflow_dispatch:
  schedule:
    - cron: "17 8 * * 1"  # Mondays — refresh rosters + latest game logs

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  hitters:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build hitters_history.json (rosters + game logs + weather join)
        run: python scripts/build_hitters.py
      - name: Commit dataset
        run: bash scripts/ci/commit_push.sh "Rebuild hitter history" data/hitters_history.json
