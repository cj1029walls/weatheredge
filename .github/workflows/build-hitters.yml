name: Build hitter history

on:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * 1"   # Mondays — refresh rosters + latest game logs

permissions:
  contents: write

jobs:
  hitters:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build hitters_history.json (rosters + game logs + weather join)
        run: python scripts/build_hitters.py
      - name: Commit dataset
        run: |
          git config user.name "weatheredge-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/hitters_history.json
          git commit -m "Rebuild hitter history" || echo "no changes"
          git pull --rebase origin main
          git push
