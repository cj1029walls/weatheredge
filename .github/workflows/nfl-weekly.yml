name: NFL weekly slate build

on:
  workflow_dispatch:
  schedule:
    - cron: "30 9 * * *"    # daily ~5:30 AM ET — forecasts sharpen as kickoff nears
    - cron: "0 15 * * 0"    # Sundays ~11 AM ET — final pre-kick refresh

permissions:
  contents: write

jobs:
  nfl-slate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build site/nfl/data.json
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python scripts/nfl/weekly_build.py
      - name: Grade PRO leans (completed weeks)
        run: python scripts/pro/nfl_grade.py || echo "grading skipped"
      - name: Build site/pro/nfl.json (PRO weekly board)
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python scripts/pro/nfl_build.py
      - name: Commit slate data
        run: |
          git config user.name "weatheredge-bot"
          git config user.email "actions@users.noreply.github.com"
          git add site/nfl/data.json site/pro/nfl.json data/pro/nfl_predictions 2>/dev/null || true
          git add site/pro/nfl_record.json data/pro/nfl_results.json 2>/dev/null || true
          git commit -m "NFL slate refresh" || echo "no changes"
          git pull --rebase origin main
          git push
