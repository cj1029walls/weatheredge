name: PRO props odds feed

on:
  workflow_dispatch:
  # Started by the Clock workflow (scripts/ci/clock.py) at 10:12 AM and
  # 4:23 PM Eastern, ~25 min before a daily.yml run, which then reuses this
  # feed (PROPS_REUSE_MIN) instead of buying the same lines again. No
  # `schedule:` of its own: GitHub delivered it hours late, after the daily
  # run it was meant to precede, and daily.yml buys the lines itself anyway.

permissions:
  contents: write
  actions: write      # to ask for a publish (see the last steps)

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  props:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build site/pro/props.json
        id: props
        continue-on-error: true
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          GAMES_CAP: "16"
          MARKETS: "batter_home_runs,batter_home_runs_alternate,pitcher_strikeouts"
        run: python scripts/odds/props_build.py
      - name: Mark feed stale
        if: steps.props.outcome == 'failure'
        run: python scripts/ci/mark_stale.py site/pro/props.json "the odds refresh failed; prices are from the last successful pull"
      - name: Commit feed
        if: ${{ !cancelled() }}
        run: bash scripts/ci/commit_push.sh "PRO props refresh" site/pro/props.json
      - name: Ask for a publish
        # A run the Clock started belongs to github-actions[bot], and GitHub
        # raises no workflow_run event for it, so publish.yml would never hear
        # that new data was committed. (Scheduled and hand-started runs still
        # reach publish.yml through workflow_run.)
        if: ${{ !cancelled() && github.actor == 'github-actions[bot]' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run publish.yml -R "$GITHUB_REPOSITORY" --ref main
      - name: Report
        if: ${{ !cancelled() }}
        run: bash scripts/ci/gate.sh "Props odds feed=${{ steps.props.outcome }}"
