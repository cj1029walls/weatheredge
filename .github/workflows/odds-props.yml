name: PRO props odds feed

on:
  workflow_dispatch:
  schedule:
    - cron: "0 15 * * *"    # ~11 AM ET — morning lines
    - cron: "0 21 * * *"    # ~5 PM ET — pre-slate refresh

permissions:
  contents: write

jobs:
  props:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build site/pro/props.json
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          GAMES_CAP: "16"
          MARKETS: "batter_home_runs,batter_home_runs_alternate,pitcher_strikeouts"
        run: python scripts/odds/props_build.py
      - name: Commit feed
        run: |
          git config user.name "weatheredge-bot"
          git config user.email "actions@users.noreply.github.com"
          git add site/pro/props.json
          git commit -m "PRO props refresh" || echo "no changes"
          git pull --rebase origin main
          git push
