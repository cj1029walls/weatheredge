name: Build history dataset

on:
  workflow_dispatch:
  schedule:
    - cron: "0 9 5 1 *"   # each January 5th, pick up the newly published Retrosheet season

permissions:
  contents: write

jobs:
  history:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build parks_history.json (Retrosheet + Open-Meteo archive)
        run: python scripts/build_history.py
      - name: Commit dataset
        run: |
          git config user.name "weatheredge-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/parks_history.json
          git add data/umps_history.json || true
          git commit -m "Rebuild historical dataset" || echo "no changes"
          git pull --rebase origin main
          git push
