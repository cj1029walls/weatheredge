name: Publish site

# Redeploys main to GitHub Pages after a sport/odds workflow has committed new
# JSON, WITHOUT re-running the MLB build and without spending any API credits.
# The six MLB files daily.yml builds but never commits (site/data.json,
# accuracy.json, teaser.json, pro/data.json, pro/record.json, pro/umps.json) are
# carried forward from the live site; if any of them can't be fetched and
# validated, nothing is deployed -- we never publish a site missing MLB data.
#
# Loop-safe: this workflow never commits or pushes, is not in its own
# `workflows:` list, and pushes made with GITHUB_TOKEN never trigger `push`.

on:
  workflow_run:
    # Must match each workflow's `name:` exactly, and only fires for workflow
    # files on the default branch.
    workflows:
      - "NFL weekly slate build"
      - "CFB weekly slate build"
      - "PGA weekly build"
      - "NASCAR weekly build"
      - "PRO props odds feed"
    types: [completed]
    branches: [main]
  push:
    # Optional: page edits pushed by a person go live now instead of at the
    # next daily build. Bot pushes (GITHUB_TOKEN) never trigger this.
    branches: [main]
    paths: ["site/**"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read      # to see whether a daily build is running

# Publishes queued behind one another collapse to the newest one. Deliberately
# NOT the daily.yml group: there a queued publish would replace (cancel) a daily
# run that is waiting for its turn. Instead the first step waits out any daily
# run, so a publish never deploys while a daily build is running: no two
# deploy-pages calls at once, and no publish carrying forward the live MLB
# files and then deploying them over a NEWER daily deploy. (A daily run that
# starts after that check needs 6+ minutes to reach its deploy; a publish
# finishes in well under one.)
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    # success: new JSON was committed. failure: the sport workflows still
    # commit their "not refreshed" markers (and grading) before they go red,
    # and those must reach the page too. cancelled/timed_out/skipped: skip.
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success' ||
      github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.retry.outputs.page_url }}
    steps:
      - name: Wait for any daily build to finish
        # Up to 50 min (a daily run is capped at 45). If the check itself
        # fails, publish anyway rather than hold the update back. Only a run
        # that is actually moving counts: on Oct 6, 2026 a daily run's deploy
        # job hung in "waiting" for 30 days, and every publish in that month
        # sat out the full 50 minutes behind it. A run that is waiting,
        # pending behind another, or silent for 45+ minutes is not one to
        # wait for (the Clock workflow cancels it). A daily run that finished
        # in the last 3 minutes still counts: Pages goes on finishing its
        # deployment after the job reports success, refuses another one
        # meanwhile, and until it is done the live MLB files are the old ones.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 150); do
            if ! n=$(gh run list -R "$GITHUB_REPOSITORY" --workflow daily.yml --limit 10 \
                       --json status,updatedAt \
                       --jq '[.[] | (now - (.updatedAt | fromdateiso8601)) as $idle | select(((.status == "in_progress" or .status == "queued") and $idle < 2700) or (.status == "completed" and $idle < 180))] | length'); then
              echo "::warning title=Could not check for a daily build::publishing now"
              exit 0
            fi
            if [ "$n" = "0" ]; then exit 0; fi
            if [ "$i" = "1" ]; then echo "A daily build is running or has just deployed; waiting for it"; fi
            sleep 20
          done
          echo "::warning title=Daily build still running::publishing anyway after 50 minutes"
      - uses: actions/checkout@v4
        with:
          ref: main          # the newest main when this (possibly queued) run starts
      - name: Carry forward the live MLB files (built by daily.yml, never committed)
        run: python3 scripts/ci/carry_forward.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
      # Pages refuses a deployment while another one is still finishing (Nov 9,
      # 2026: refused 78 s after a daily deploy had reported success). The one
      # in the way may be a daily build's, carrying newer MLB files than the
      # copies taken above -- so wait, take them again, and deploy that.
      - name: Refused -- wait, then take the live MLB files again
        if: steps.deployment.outcome == 'failure'
        run: |
          sleep 120
          python3 scripts/ci/carry_forward.py
      - if: steps.deployment.outcome == 'failure'
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-retry
          path: site
      - id: retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-retry
